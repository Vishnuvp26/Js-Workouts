<!DOCTYPE html>
<html lang="en">
<head>

    <title>Namaste JS</title>

<body>
<!--

    <div id="parent" style="padding: 20px; background-color: lightblue;">
        <p>Click inside the parent container!</p>
        <button id="child" style="padding: 10px; background-color: lightgreen;">
            Click me (Child)
        </button>
    </div>

    <script>
        document.getElementById('parent').addEventListener('click', () => {
            console.log('parent clicked');
        })

        document.getElementById('child').addEventListener('click', (event) => {
            console.log('child clicked');
            // event.stopPropagation() bubbles up
        })
    </script>

</body>
